
workflows:
  rbfai-android:
    name: RBF AI Android APK Build
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Find Android project and build APK
        script: |
          set -e

          if [ ! -f "./gradlew" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -type f | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p extracted_project
              unzip -o "$ZIP_FILE" -d extracted_project
            fi
          fi

          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found. Check project files."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - "**/app/build/outputs/apk/release/*.apk"
      - "**/app/build/outputs/apk/debug/*.apk"
     
