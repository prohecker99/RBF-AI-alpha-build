
workflows:
  rbfai-android:
    name: RBF AI Android APK Build
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Grant Gradle permission
        script: |
          chmod +x gradlew

      - name: Build release APK
        script: |
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - AnshandKashif@rbfai.com
        notify:
          success: true
          failure: true
